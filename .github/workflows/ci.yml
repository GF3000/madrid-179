name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest  # los generadores de PDF usan fuentes de Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip install -e backend
      - name: Compilar
        run: python -m compileall -q backend/pipeline backend/madrid179 backend/api
      - name: Entrenar el modelo (artefacto para la API)
        run: python backend/pipeline/entrenar.py
      - name: Tests (equivalencia con las salidas versionadas, preferencias y API)
        run: python -m pytest backend/tests -q
      - name: Auditoría de las CPT (cálculo manual vs pgmpy)
        run: python backend/pipeline/auditoria_cpts.py
