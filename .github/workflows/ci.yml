name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest  # los generadores de PDF usan fuentes de Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compilar el pipeline
        run: python -m compileall -q backend/pipeline
      - name: Auditoría de las CPT (cálculo manual vs pgmpy)
        run: python backend/pipeline/auditoria_cpts.py
